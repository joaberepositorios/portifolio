<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joabe Alves - Portifólio</title>
<meta name="description" content="Este portifólio porta minhas experiências acadêmicas e profissionais, segue abaixo em sequências minhas habilidades desenvolvidas durante meu percurso profissional e demonstrações de eficiência produtiva. ">
<meta name="theme-color" content="#eef2fa">
<meta name="color-scheme" content="light">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=49">
<link rel="stylesheet" href="css/base.css?v=49">
<link rel="stylesheet" href="css/layout.css?v=49">
<link rel="stylesheet" href="css/components.css?v=49">
</head>
<body>

<!-- Sprite de ícones: um traço só, herdando a cor do texto. -->
<svg class="icon-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-art" viewBox="0 0 24 24">
    <path d="M3.5 5h5.5a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H3.5z"/>
    <path d="M20.5 5H15a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5h6z"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M8 5.5l11 6.5-11 6.5z"/>
  </symbol>
  <symbol id="i-linkedin" viewBox="0 0 24 24">
    <path d="M16 8.5a5.5 5.5 0 0 1 5.5 5.5v6.5h-3.6V14a1.9 1.9 0 0 0-3.8 0v6.5h-3.6V9h3.6v1.4A5 5 0 0 1 16 8.5z"/>
    <rect x="2.6" y="9" width="3.6" height="11.5" rx=".4"/>
    <circle cx="4.4" cy="4.6" r="1.9"/>
  </symbol>
  <symbol id="i-github" viewBox="0 0 24 24">
    <path d="M9.4 20.6c-3.7 1.1-3.7-2-5.2-2.4m11 4.8v-3c0-.9-.1-1.2-.6-1.7 2.3-.3 4.6-1.1 4.6-4.9a3.8 3.8 0 0 0-1-2.6 3.5 3.5 0 0 0-.1-2.6s-.9-.3-2.9 1a9.8 9.8 0 0 0-5 0c-2-1.3-2.9-1-2.9-1a3.5 3.5 0 0 0-.1 2.6 3.8 3.8 0 0 0-1 2.6c0 3.8 2.3 4.6 4.6 4.9-.4.4-.6.9-.6 1.7v3"/>
  </symbol>
  <symbol id="i-instagram" viewBox="0 0 24 24">
    <rect x="3" y="3" width="18" height="18" rx="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="17.2" cy="6.8" r=".9"/>
  </symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24">
    <rect x="2.2" y="5.4" width="19.6" height="13.2" rx="4"/>
    <path d="M10.2 9.2l5.4 2.8-5.4 2.8z"/>
  </symbol>
</svg>

<!-- véu escuro da abertura, o campo de bolas animadas e o robô em WebGL -->
<div class="page-dark" id="pageDark" aria-hidden="true"></div>
<canvas id="backdrop" aria-hidden="true"></canvas>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="foreground" aria-hidden="true"></canvas>

<a class="skip-link" href="#curriculo">Pular para o conteúdo</a>

<!-- Barra de seções: fixa no topo. Clara sobre o escuro da abertura e escura
     sobre o papel — a cor sai de --dark-step, a mesma curva que dissolve o véu,
     então a troca acontece junto com o fundo e não em cima dele. -->
<nav class="menubar" aria-label="Seções do site">
  <ul class="menubar__list">
    <li><a href="#curriculo">Experiências</a></li>
    <li><a href="#projetos">Projetos</a></li>
    <li><a href="#artigos">Artigos</a></li>
    <li><a href="#competencias">Competências</a></li>
  </ul>
</nav>


<main>

  <!-- 1. INTRODUÇÃO -->
  <section id="intro" class="section section--intro">
    <header class="intro-head">
      <div id="heroPortrait"></div>
      <h1 class="display" data-reveal data-reveal-delay="80"><span id="heroName"></span></h1>
      <p class="hero-rule" aria-hidden="true" data-parallax="0.10"></p>
      <p class="lead" id="heroLead" data-reveal data-reveal-delay="160"></p>
      <div id="heroSocial" data-reveal data-reveal-delay="240"></div>
    </header>

    <!-- Fica preso ao rodapé da primeira tela: é o sinal de que há mais abaixo. -->
    <a class="scroll-cue" href="#curriculo" data-reveal data-reveal-delay="320">
      <span class="scroll-cue__label">Role para explorar</span>
      <span class="scroll-cue__line" aria-hidden="true"></span>
    </a>
  </section>

  <!-- 2. CURRÍCULO DIGITAL -->
  <section id="curriculo" class="section">
    <div class="section-head">
      <h2 data-reveal>Experiências acadêmicas</h2>
      <p class="section-sub" id="aboutText" data-reveal data-reveal-delay="80"></p>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 3. PROJETOS EM DESTAQUE -->
  <section id="projetos" class="section">
    <div class="section-head">
      <h2 data-reveal>Projetos em destaque</h2>
    </div>
    <div class="projects" id="projects"></div>
  </section>

  <!-- 4. ARTIGOS PUBLICADOS -->
  <section id="artigos" class="section">
    <div class="section-head">
      <h2 data-reveal>Artigos publicados</h2>
    </div>
    <div class="papers" id="papers"></div>
  </section>

  <!-- 5. COMPETÊNCIAS + CURRÍCULO ATUAL -->
  <section id="competencias" class="section">
    <div class="section-head">
      <h2 data-reveal>Competências técnicas</h2>
    </div>
    <div class="skills" id="skills"></div>
    <div class="cv" id="cvCard" data-reveal></div>
  </section>

</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal__backdrop" data-close></div>
  <div class="modal__panel">
    <header class="modal__bar">
      <h4 id="modalTitle"></h4>
      <button class="modal__close" type="button" data-close aria-label="Fechar">✕</button>
    </header>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<!-- Scripts clássicos com `defer`: rodam na ordem declarada, depois do HTML, e
     funcionam também abrindo o arquivo direto do disco (file://).
     O `?v=` no fim de cada arquivo é o carimbo de versão: subir esse número obriga
     o navegador a buscar CSS e JS novos em vez de servir os do cache. -->
<script defer src="js/content.js?v=49"></script>

<script defer src="js/core/ease.js?v=49"></script>
<script defer src="js/core/dom.js?v=49"></script>
<script defer src="js/core/ticker.js?v=49"></script>
<script defer src="js/core/geometry.js?v=49"></script>
<script defer src="js/core/scroll.js?v=49"></script>

<script defer src="js/ui/modal.js?v=49"></script>
<script defer src="js/ui/tech-icons.js?v=49"></script>
<script defer src="js/ui/badges.js?v=49"></script>
<script defer src="js/ui/sections.js?v=49"></script>
<script defer src="js/ui/backdrop.js?v=49"></script>
<script defer src="js/ui/reveal.js?v=49"></script>
<script defer src="js/ui/parallax.js?v=49"></script>
<script defer src="js/ui/chrome.js?v=49"></script>

<script defer src="js/robot/math.js?v=49"></script>
<script defer src="js/robot/gl.js?v=49"></script>
<script defer src="js/robot/shaders.js?v=49"></script>
<script defer src="js/robot/rig.js?v=49"></script>
<script defer src="js/robot/explode.js?v=49"></script>
<script defer src="js/robot/guides.js?v=49"></script>
<script defer src="js/robot/index.js?v=49"></script>

<script defer src="js/main.js?v=49"></script>
</body>
</html>
