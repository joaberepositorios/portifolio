<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Monitoria — Cálculo 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff; --fg: #111318; --muted: #5b6270; --line: #e5e7eb;
      --accent: #1f4e9a; --accent-soft: #eaf0fa;
      --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-heading: "Source Serif 4", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    /* ───── catálogo ───── */
    .wrap { width: min(1180px, 100% - 48px); margin: 0 auto; padding: 48px 0 64px; }
    .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .head h1 { margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 2rem; line-height: 1.1; }
    .head p { margin: 6px 0 0; color: var(--muted); font-size: 0.92rem; }
    .head small { color: var(--muted); font-size: 0.8rem; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 26px 20px; margin-top: 28px; }
    .card { display: flex; flex-direction: column; gap: 10px; padding: 0; border: 0; background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; }
    .card .cover {
      position: relative; aspect-ratio: 210 / 212; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #f4f6f9;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s;
    }
    .card .cover img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .card .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 70%, rgba(17, 19, 24, 0.06)); }
    .card:hover .cover { transform: translateY(-4px); box-shadow: 0 16px 30px -18px rgba(17, 19, 24, 0.35); border-color: #cfd4dc; }
    .card .n { position: absolute; top: 10px; left: 10px; z-index: 1; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; }
    .card h2 { margin: 0; font-size: 0.95rem; font-weight: 500; line-height: 1.3; }
    .card span { color: var(--muted); font-size: 0.78rem; }
    .card:focus-visible { outline: none; }
    .card:focus-visible .cover { outline: 2px solid var(--accent); outline-offset: 3px; }

    .foot { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.8rem; }
    .foot a { color: var(--accent); text-decoration: none; }

    /* ───── leitor (tela cheia) ───── */
    .reader { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #f4f6f9; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .bar h2 { flex: 1; min-width: 0; margin: 0; font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg);
      font: inherit; font-size: 0.85rem; font-weight: 500; text-decoration: none; cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .btn:hover { background: #f4f6f9; border-color: #cfd4dc; }
    .btn--accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn--accent:hover { background: #17407f; border-color: #17407f; }
    .btn svg { width: 16px; height: 16px; flex: none; }
    .frame { flex: 1; border: 0; width: 100%; }
    .reader:fullscreen { background: var(--bg); }

    @media (max-width: 600px) {
      .wrap { width: min(1180px, 100% - 32px); padding-top: 28px; }
      .head h1 { font-size: 1.5rem; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 14px; }
      .btn .label { display: none; }
      .btn { padding: 0 10px; }
    }
  </style>
</head>
<body>
  <main class="wrap" id="catalogo">
    <header class="head">
      <div>
        <h1>Monitoria — Cálculo 2</h1>
        <p>Cálculo Diferencial e Integral II · Engenharia Ambiental e Sanitária · UFU</p>
      </div>
      <small>Material de apoio da monitoria. Não substitui o material do docente.</small>
    </header>
    <div class="grid" id="grid"></div>
    <footer class="foot">Joabe Alves Pereira · <a href="../">portfólio</a></footer>
  </main>

  <section class="reader" id="reader" hidden aria-label="Leitor de PDF">
    <div class="bar">
      <button class="btn" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        <span class="label">Catálogo</span>
      </button>
      <h2 id="title"></h2>
      <a class="btn" id="open" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
        <span class="label">Nova aba</span>
      </a>
      <a class="btn" id="download" href="#" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>
        <span class="label">Baixar</span>
      </a>
      <button class="btn btn--accent" id="full">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <span class="label">Tela cheia</span>
      </button>
    </div>
    <iframe class="frame" id="frame" title="Material em PDF"></iframe>
  </section>

  <script>
    const $ = (id) => document.getElementById(id);
    const catalogo = $("catalogo"), grid = $("grid"), reader = $("reader"), frame = $("frame"), title = $("title");
    let itens = [];

    function abrir(i, push = true) {
      const it = itens[i]; if (!it) return;
      const url = "pdf/" + it.arquivo;
      frame.src = url + "#toolbar=0&navpanes=0&view=FitH";
      title.textContent = it.titulo; document.title = it.titulo + " — Monitoria";
      $("open").href = url; $("download").href = url; $("download").download = it.titulo + ".pdf";
      catalogo.hidden = true; reader.hidden = false;
      if (push) history.pushState({ i }, "", "#" + it.arquivo.replace(/\.pdf$/, ""));
    }
    function fechar(push = true) {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      reader.hidden = true; catalogo.hidden = false; frame.src = "about:blank";
      document.title = "Monitoria — Cálculo 2";
      if (push) history.pushState(null, "", location.pathname);
    }

    fetch("lista.json").then((r) => r.json()).then((mapa) => {
      itens = Object.entries(mapa).map(([arquivo, m]) => ({ arquivo, ...m }));
      const peso = (t) => /fundamentos/i.test(t) ? 0 : 1;
      itens.sort((a, b) => peso(a.titulo) - peso(b.titulo) || a.titulo.localeCompare(b.titulo, "pt-BR"));
      grid.innerHTML = itens.map((it, i) => `
        <button class="card" type="button" data-i="${i}">
          <div class="cover"><span class="n">${String(i + 1).padStart(2, "0")}</span><img src="${it.capa}" alt="" loading="lazy" width="210" height="212"></div>
          <h2>${it.titulo}</h2>
          <span>${it.paginas} página${it.paginas > 1 ? "s" : ""} · PDF · ${it.kb} KB</span>
        </button>`).join("");
      grid.addEventListener("click", (e) => { const b = e.target.closest(".card"); if (b) abrir(+b.dataset.i); });
      const hash = location.hash.slice(1);
      const idx = itens.findIndex((it) => it.arquivo.replace(/\.pdf$/, "") === hash);
      if (idx >= 0) abrir(idx, false);
    });

    $("back").addEventListener("click", () => fechar());
    window.addEventListener("popstate", (e) => { if (e.state && e.state.i != null) abrir(e.state.i, false); else fechar(false); });

    $("full").addEventListener("click", async () => {
      if (document.fullscreenElement) { await document.exitFullscreen().catch(() => {}); return; }
      try { await reader.requestFullscreen(); } catch {}
    });
    document.addEventListener("fullscreenchange", () => {
      $("full").querySelector(".label").textContent = document.fullscreenElement ? "Sair" : "Tela cheia";
    });
  </script>
</body>
</html>
